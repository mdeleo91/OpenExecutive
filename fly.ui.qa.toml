# Fly.io config — Open Executive UI, QA environment.
# Deploy: fly deploy --config fly.ui.qa.toml --remote-only

app = "openexecutive-ui-qa"
primary_region = "mia"

[build]
  dockerfile = "docker/Dockerfile.ui"

[env]
  BACKEND_BASE_URL = "http://openexecutive-api-qa.internal:8000"
  AUTH_TRUST_HOST = "true"
  # Secrets (--app openexecutive-ui-qa):
  #   AUTH_SECRET, AUTH_GOOGLE_ID, AUTH_GOOGLE_SECRET, ALLOWED_EMAILS,
  #   AUTH_URL -> https://openexecutive-ui-qa.fly.dev
  #   BACKEND_SHARED_SECRET  (MUST match openexecutive-api-qa)

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0   # QA can cold-start from zero to save cost

  [[http_service.checks]]
    method = "GET"
    path = "/"
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
