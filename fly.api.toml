# Fly.io config — Open Executive API (FastAPI backend), DEV/production app.
#
# Deploy:  fly deploy --config fly.api.toml --remote-only
# Build context is the repo root (the directory this file lives in), which is
# what docker/Dockerfile expects.
#
# ⚠️ SINGLE INSTANCE ONLY. The API's scheduler claims rows with
# `UPDATE ... RETURNING`, which double-fires if two API machines run. This
# config pins the app to one machine and uses a replace-in-place rollout.
# Do NOT `fly scale count 2` this app.

app = "openexecutive-api"
primary_region = "dfw"  # Dallas (mia/Miami is deprecated on Fly)

[build]
  dockerfile = "docker/Dockerfile"

[deploy]
  strategy = "immediate"

[env]
  OE_PUBLIC_DEPLOYMENT = "1"
  VECTOR_STORE_PATH = "/data/chroma_db"
  EPISODIC_DB_PATH = "/data/episodic_memory.db"
  COMPANY_PROFILE_PATH = "/data/company/profile.yaml"
  # Secrets set separately (NOT in this file):
  #   ANTHROPIC_API_KEY, BACKEND_SHARED_SECRET, BACKEND_ALLOWED_ORIGINS

[mounts]
  source = "executive_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "10s"
    grace_period = "5m"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
