# Fly.io config — Open Executive API (FastAPI backend), DEV/production app.
#
# ⚠️ SINGLE INSTANCE ONLY. The API's scheduler claims rows with
# `UPDATE ... RETURNING`; a second machine double-fires. Do NOT scale to 2.

app = "openexecutive-api"
primary_region = "dfw"  # Dallas (mia/Miami is deprecated on Fly)

[build]
  dockerfile = "docker/Dockerfile"

[deploy]
  strategy = "immediate"
  # Apply chat-history migrations against the attached Managed Postgres before
  # the new machine serves traffic. Exits 0 (no-op) until DATABASE_URL exists,
  # so this is safe to deploy before `fly mpg attach` has run.
  release_command = "python -m openexecutive.memory.migrate"

# Bind uvicorn to :: (IPv6, dual-stack — also accepts IPv4). Fly's private 6PN
# network between apps is IPv6-only, so the UI reaches openexecutive-api.internal
# only if the API listens on IPv6. 0.0.0.0 is IPv4-only -> ECONNREFUSED over 6PN.
[processes]
  app = "uvicorn openexecutive.api.main:app --host :: --port 8000"

[env]
  OE_PUBLIC_DEPLOYMENT = "1"
  VECTOR_STORE_PATH = "/data/chroma_db"
  EPISODIC_DB_PATH = "/data/episodic_memory.db"
  COMPANY_PROFILE_PATH = "/data/company/profile.yaml"

[mounts]
  source = "executive_data"
  destination = "/data"
  processes = ["app"]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "10s"
    grace_period = "5m"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
  processes = ["app"]
