# Fly.io config — Open Executive UI (Next.js), DEV/production app.
#
# Deploy:  fly deploy --config fly.ui.toml --remote-only
# Build context is the repo root; docker/Dockerfile.ui builds packages/ui.
# The UI is stateless — no volume, safe to run more than one machine.

app = "openexecutive-ui"
primary_region = "mia"

[build]
  dockerfile = "docker/Dockerfile.ui"

[env]
  # Reach the API privately over Fly's 6PN network. The API is single-instance,
  # so its <app>.internal AAAA record points at that one machine on port 8000.
  BACKEND_BASE_URL = "http://openexecutive-api.internal:8000"
  AUTH_TRUST_HOST = "true"
  # Secrets set separately (fly secrets set KEY=value --app openexecutive-ui):
  #   AUTH_SECRET            (openssl rand -base64 33)
  #   AUTH_GOOGLE_ID / AUTH_GOOGLE_SECRET   (Google Cloud Console OAuth client)
  #   ALLOWED_EMAILS         (comma-separated sign-in allow-list)
  #   AUTH_URL               (this app's public URL, e.g. https://openexecutive-ui.fly.dev)
  #   BACKEND_SHARED_SECRET  (MUST match the value set on openexecutive-api)

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1   # set 0 to scale to zero when idle (adds cold starts)

  [[http_service.checks]]
    method = "GET"
    path = "/"
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
