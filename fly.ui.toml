# Fly.io config — Open Executive UI (Next.js), DEV/production app.
#
# Deploy:  fly deploy --config fly.ui.toml --remote-only
# Build context is the repo root; docker/Dockerfile.ui builds packages/ui.
# The UI is stateless — no volume.

app = "openexecutive-ui"
primary_region = "dfw"  # Dallas (mia/Miami is deprecated on Fly)

[build]
  dockerfile = "docker/Dockerfile.ui"

[env]
  # Reach the API privately over Fly's 6PN network.
  BACKEND_BASE_URL = "http://openexecutive-api.internal:8000"
  AUTH_TRUST_HOST = "true"
  # Secrets set separately (fly secrets set ... --app openexecutive-ui):
  #   AUTH_SECRET, AUTH_GOOGLE_ID, AUTH_GOOGLE_SECRET, ALLOWED_EMAILS,
  #   AUTH_URL, BACKEND_SHARED_SECRET (must match the API)

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  # No HTTP health check: the UI gates "/" behind sign-in and 302-redirects,
  # which Fly would read as unhealthy. Fly's connect check (machine started +
  # accepting TCP on 3000) is enough here. Add a check on a public 200 route
  # later if desired.

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
