name: Fly Deploy (production)

# Self-provisioning deploy to Fly.io on every push to main (and on-demand via
# "Run workflow"). On first run it creates the apps + API volume, pushes the
# secrets from this repo's GitHub Actions secrets to the right app, and deploys
# — API first, then UI.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   FLY_API_TOKEN          Fly deploy token
#   ANTHROPIC_API_KEY      your Anthropic key (sk-ant-...)
#   BACKEND_SHARED_SECRET  shared header secret (same value used by both apps)
#   AUTH_SECRET            Auth.js session secret (UI)
# Optional (needed for the UI's Google sign-in — add later):
#   AUTH_GOOGLE_ID, AUTH_GOOGLE_SECRET, ALLOWED_EMAILS
#
# Adjust these if you rename apps or change region:
env:
  FLY_ORG: personal
  FLY_REGION: mia
  API_APP: openexecutive-api
  UI_APP: openexecutive-ui

concurrency:
  group: fly-deploy-production
  cancel-in-progress: false

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Create app + volume (idempotent)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl apps create "$API_APP" --org "$FLY_ORG" 2>/dev/null || true
          flyctl volumes create executive_data --app "$API_APP" \
            --region "$FLY_REGION" --size 3 --yes 2>/dev/null || true

      - name: Stage secrets
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl secrets set --stage --app "$API_APP" \
            ANTHROPIC_API_KEY='${{ secrets.ANTHROPIC_API_KEY }}' \
            BACKEND_SHARED_SECRET='${{ secrets.BACKEND_SHARED_SECRET }}' \
            BACKEND_ALLOWED_ORIGINS="https://${UI_APP}.fly.dev"

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --config fly.api.toml --remote-only --ha=false

  deploy-ui:
    name: Deploy UI
    needs: deploy-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Create app (idempotent)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl apps create "$UI_APP" --org "$FLY_ORG" 2>/dev/null || true

      - name: Stage secrets
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID }}
          AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
          ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
        run: |
          # Only include the Google sign-in secrets once they've been added,
          # so the UI still deploys before Google OAuth is configured.
          extra=""
          [ -n "$AUTH_GOOGLE_ID" ]     && extra="$extra AUTH_GOOGLE_ID=$AUTH_GOOGLE_ID"
          [ -n "$AUTH_GOOGLE_SECRET" ] && extra="$extra AUTH_GOOGLE_SECRET=$AUTH_GOOGLE_SECRET"
          [ -n "$ALLOWED_EMAILS" ]     && extra="$extra ALLOWED_EMAILS=$ALLOWED_EMAILS"
          flyctl secrets set --stage --app "$UI_APP" \
            BACKEND_SHARED_SECRET='${{ secrets.BACKEND_SHARED_SECRET }}' \
            AUTH_SECRET='${{ secrets.AUTH_SECRET }}' \
            AUTH_URL="https://${UI_APP}.fly.dev" \
            $extra

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --config fly.ui.toml --remote-only --ha=false
